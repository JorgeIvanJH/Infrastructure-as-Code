services:
  guacd: # Handles connections to remote desktops
    image: guacamole/guacd:1.6.0
    restart: unless-stopped

  guacamole: # Web application that renders the remote desktop in a browser
    image: guacamole/guacamole:1.6.0
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - type: bind
        source: ./user-mapping.xml
        target: /etc/guacamole/user-mapping.xml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
