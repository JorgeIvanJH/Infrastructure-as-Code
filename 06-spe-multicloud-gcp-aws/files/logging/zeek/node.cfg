# ZeekControl node configuration. This file will go into /opt/zeek/etc/node.cfg.
#
# One standalone node: a single Zeek process on this machine. The interface
# line is a placeholder. zeek-set-interface rewrites it at every start with the
# interface carrying the default route, so one image works on both clouds,
# where the interface name differs.
[zeek]
type=standalone
host=localhost
interface=eth0
