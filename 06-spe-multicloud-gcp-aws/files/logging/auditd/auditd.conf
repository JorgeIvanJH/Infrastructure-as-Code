#
# This file controls the configuration of the audit daemon
#
# This file will go into /etc/audit/auditd.conf. It is the stock file shipped
# by auditd 3.1.2 on Ubuntu 24.04 with three keys changed for the SPE, each
# marked with a "SPE:" comment. Everything else is the distribution default.
#

local_events = yes
write_logs = yes
log_file = /var/log/audit/audit.log
log_group = root
log_format = ENRICHED
flush = INCREMENTAL_ASYNC
freq = 50
# SPE: rotate at 10 MiB instead of the default 8.
max_log_file = 10
# SPE: keep five files, so the local buffer is about 50 MiB per SPE.
num_logs = 5
priority_boost = 4
name_format = NONE
##name = mydomain
# SPE: rotate rather than stop writing when max_log_file is reached.
max_log_file_action = ROTATE
space_left = 75
space_left_action = SYSLOG
verify_email = yes
action_mail_acct = root
admin_space_left = 50
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SUSPEND
use_libwrap = yes
##tcp_listen_port = 60
tcp_listen_queue = 5
tcp_max_per_addr = 1
##tcp_client_ports = 1024-65535
tcp_client_max_idle = 0
transport = TCP
krb5_principal = auditd
##krb5_key_file = /etc/audit/audit.key
distribute_network = no
q_depth = 2000
overflow_action = SYSLOG
max_restarts = 10
plugin_dir = /etc/audit/plugins.d
end_of_event_timeout = 2
