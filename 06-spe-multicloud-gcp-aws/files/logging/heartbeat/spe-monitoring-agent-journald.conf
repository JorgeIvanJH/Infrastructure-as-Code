# This file will go into /etc/systemd/journald.conf.d/spe-monitoring-agent.conf.
#
# The heartbeat agent prints one JSON document per interval to stdout, and
# systemd stores each line in the journal. journald cuts a stream line at
# LineMax, 48 KiB by default, and a busy interval (many commands, a lot of
# typing) produces a longer document than that; the journal would then hold two
# halves that do not parse. Until the document is sent to a collector, the
# journal is where it is read, so the limit is raised well above any realistic
# document. Everything else about the journal is left at the distribution
# default.
[Journal]
LineMax=16M
